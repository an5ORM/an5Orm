name: CI and Release

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Node dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Build TypeScript
        run: npm run build
      - name: Verify published artifact is complete
        run: npm run verify:pack
      - name: Run unit tests
        run: node test/unit.test.js
      - name: Run generator tests
        run: |
          mkdir -p ci-smoke-schema
          cat > ci-smoke-schema/CiSmoke.an5 <<'EOF'
          model CiSmoke {
            id    NVARCHAR(100) @id @default(uuid())
            email NVARCHAR(255) @unique
            name  NVARCHAR(255)?
          }
          EOF
          cat > an5Orm.config.js <<'EOF'
          // CI-only: redirect generator outputs to a throwaway dir so the
          // standalone repo tree stays pristine for the smoke test below.
          module.exports = {
            schemaDir: 'ci-smoke-schema',
            outputs: {
              typescript: { outputDir: 'ci-smoke/an5Client/typescript', metadataFile: 'ci-smoke/an5Client/typescript/an5Metadata.ts' },
              python: { metadataFile: 'ci-smoke/an5Client/python/an5_metadata.py' },
              dotnet: { outputDir: 'ci-smoke/an5Client/dotnet' },
              golang: { outputDir: 'ci-smoke/an5Client/golang' },
            },
          };
          EOF
          npm run generate && node test/generator.test.js
          rm -rf ci-smoke-schema an5Orm.config.js ci-smoke
      - name: Run smoke test
        run: npm test
      - name: Build Python package
        if: hashFiles('pyproject.toml') != ''
        run: |
          python -m pip install --upgrade pip build
          python -m build

  publish-npm:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - run: npm ci || npm install
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
